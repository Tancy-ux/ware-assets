<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ware chat test page</title>
    <style>
      /* Stand-in for a store theme, to check the chat keeps its own look. */
      body {
        margin: 0;
        font-family: "Helvetica Neue", Arial, sans-serif;
        background: #faf8f4;
        color: #222;
      }
      header {
        padding: 18px 24px;
        border-bottom: 1px solid #e5e1d8;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      main {
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.6;
      }
      button {
        background: hotpink;
      }
    </style>
  </head>
  <body>
    <header>Ware Innovations (test page)</header>
    <main>
      <h1>Store page stand-in</h1>
      <p>
        The chat bubble is bottom right. This page's own styles (uppercase
        header, pink buttons) shouldn't leak into the chat.
      </p>
      <p>
        Add to cart here opens the store's cart in a new tab; on the real
        store it adds without leaving the page.
      </p>
    </main>
    <!-- build-snippet.mjs puts the ware-chat snippet here and saves the
         result as dist/test.html (open that one). -->
    <!-- WARE_CHAT_SNIPPET -->
    <script>
      // Pretend to be a product page: test.html?product=<handle>&title=<name>
      // (add &bespoke=1 for a Ware Atelier piece).
      (function () {
        var q = new URLSearchParams(location.search);
        if (!q.get("product")) return;
        window.WareChatConfig = window.WareChatConfig || {};
        window.WareChatConfig.product = {
          handle: q.get("product"),
          title: q.get("title") || q.get("product"),
          bespoke: q.get("bespoke") === "1",
        };
      })();
    </script>
  </body>
</html>
